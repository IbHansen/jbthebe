myst: v1
title: ModelFlow Book
description: >-
  Book theme for the ModelFlow supplements. Derived from Plain LaTeX Book
  (Rowan Cockett, Curvenote / Executable Books, CC-BY-4.0), with three
  changes: notebook titles become real chapters, verbatim code wraps
  instead of running past the margin, and authors are optional.
version: '1.0.0'
authors:
  - name: Rowan Cockett
    website: https://row1.ca
    affiliations:
      - Curvenote
      - Executable Books
license: CC-BY-4.0
tags:
  - book
doc:
  - id: title
    required: true
  - id: subtitle
  - id: authors
    required: false
  - id: bibliography
files:
  - template.tex
packages:
  - babel
  - caption
  - changepage
  - enumitem
  - fancyvrb
  - fontenc
  - framed
  - fvextra
  - geometry
  - graphicx
  - hyperref
  - inputenc
  - lmodern
  - natbib
  - xcolor
  - amssymb
